name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 3.6.161 补：windows-latest 的控制台编码是 cp1252（en-US 区域），而 quality_gate 与
# pytest 都会往 stdout 打中文 —— 不设这两个变量会直接 UnicodeEncodeError 崩在最后一行
# 报告上（本地是 GBK 所以永远复现不出来，只有 CI 红）。
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    # 主目标平台是 Windows：启动面板、进程管理、局域网配对都按 Windows 实现，
    # 换到 ubuntu-latest 会有一批用例假红，所以固定 windows-latest。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 工程纪律闸门
        run: python scripts/quality_gate.py

      # ruff 按 ruff.toml 的定位只做辅助提示（权威判定在上面那步），
      # 所以这里不阻塞合并：风格问题不该挡住功能修复。
      - name: 静态检查（辅助，不阻塞）
        continue-on-error: true
        run: python -m ruff check .

      - name: 单元测试
        run: python -m pytest tests/ -q
